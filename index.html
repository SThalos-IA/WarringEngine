<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warring Engine</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="game">

    <header>

        <h1>Warring Engine</h1>

    </header>

    <div id="topBar">

    <button id="capituloAnterior">

        ◀ Capítulo

    </button>

    <label for="capitulo">

        Capítulo

    </label>

    <select id="capitulo">

        <option value="cap01">Capítulo 1</option>
        <option value="cap02">Capítulo 2</option>
        <option value="cap03">Capítulo 3</option>
        <option value="cap04">Capítulo 4</option>
        <option value="cap05">Capítulo 5</option>
        <option value="cap06">Capítulo 6</option>
        <option value="cap07">Capítulo 7</option>
        <option value="cap08">Capítulo 8</option>
        <option value="cap09">Capítulo 9</option>
        <option value="cap10">Capítulo 10</option>
        <option value="cap11">Capítulo 11</option>
        <option value="cap12">Capítulo 12</option>
        <option value="cap13">Capítulo 13</option>
        <option value="cap14">Capítulo 14</option>
        <option value="cap15">Capítulo 15</option>
        <option value="cap16">Capítulo 16</option>
        <option value="cap17">Capítulo 17</option>
        <option value="cap18">Capítulo 18</option>
        <option value="cap19">Capítulo 19</option>

    </select>

    <button id="abrir">

        Abrir

    </button>

    <button id="proximoCapitulo">

        Capítulo ▶

    </button>

</div>


    <main>

<div id="historyPanel" class="hidden">

    <div id="historyTitle">

    Histórico

    <button id="fecharHistorico">

        ✕ Fechar

    </button>

</div>

    <div id="historyContent">

    </div>

</div>

        <div id="textoArea">

            <div id="characterName">

            </div>

            <div id="dialogue">

            </div>

        </div>

        <div id="portrait">

            <img

                id="characterImage"

                src=""

                alt=""

                class="hidden"

            >

        </div>

    </main>

    <footer>

    <div id="status">

        <div id="chapterInfo">

            Capítulo 1

        </div>

        <div id="sceneInfo">

            Cena 1 / 1

        </div>

        <progress

            id="progressBar"

            value="0"

            max="100">

        </progress>

    </div>

    <div id="botoes">

        <button id="previous">

            ◀ Anterior

        </button>

        <button id="next">

            Próximo ▶

        </button>

    </div>

</footer>

</div>

<script src="js/engine.js"></script>

</body>

</html>
